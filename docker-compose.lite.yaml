# BuffaLogs Lite - Minimal Docker setup for development
# Usage: docker compose -f docker-compose.lite.yaml up --build
#
# Services: 4 containers (~2-3GB total vs 7GB full stack)
# - PostgreSQL Alpine (~80MB)
# - RabbitMQ Alpine (~100MB)
# - BuffaLogs Django + Celery (~350MB)
# - Frontend Next.js (~250MB)

services:

  # ============================================
  # Database - PostgreSQL Alpine (lightweight)
  # ============================================
  postgres:
    image: postgres:15
    container_name: buffalogs_db
    hostname: postgres
    platform: linux/arm64
    environment:
      POSTGRES_USER: default_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: buffalogs
    volumes:
      - buffalogs_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U default_user -d buffalogs"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - buffalogs-network

  # ============================================
  # Message Broker - RabbitMQ Alpine (no management UI)
  # Using base alpine without management saves ~50MB
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: buffalogs_mq
    hostname: rabbitmq
    platform: linux/arm64
    volumes:
      - buffalogs_mq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - buffalogs-network

  # ============================================
  # Django App + Celery (combined in one container)
  # Runs: Django dev server + Celery worker + Celery beat
  # ============================================
  buffalogs:
    build:
      context: .
      dockerfile: build/Dockerfile.lite
    image: buffalogs:lite
    container_name: buffalogs_app
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py setup_config 2>/dev/null || true &&
        celery -A buffalogs worker -B -c 1 --loglevel=info &
        python manage.py runserver 0.0.0.0:8000
      "
    environment:
      - BUFFALOGS_ENV=docker
      - BUFFALOGS_POSTGRES_PORT=5432
      - BUFFALOGS_POSTGRES_DB=buffalogs
      - BUFFALOGS_POSTGRES_USER=default_user
      - BUFFALOGS_POSTGRES_PASSWORD=password
      - BUFFALOGS_SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - ./config:/opt/certego/config:ro
      - ./buffalogs:/opt/certego/buffalogs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - buffalogs-network

  # ============================================
  # Frontend - Next.js Alpine
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: buffalogs:frontend
    container_name: buffalogs_ui
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SESSION_TIMEOUT=60000
      - NEXT_PUBLIC_SESSION_WARNING_TIME=30000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - buffalogs
    networks:
      - buffalogs-network

volumes:
  buffalogs_db:
  buffalogs_mq:

networks:
  buffalogs-network:
    driver: bridge
    name: buffalogs-network
